# =============================================================================
# ofdm-papr-communication-link
# A Modular End-to-End OFDM Communication Link Simulator
# with PAPR Reduction Techniques and Performance Analysis
# =============================================================================
[project]
name = "ofdm-papr-communication-link"
version = "0.1.0"
description = "A modular OFDM communication-link simulator focused on PAPR reduction techniques."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mohammad Amin Khodadadi", email = "aminKhodadadi006@gmail.com" },
]
keywords = ["ofdm", "papr", "communication", "simulation", "wireless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Communications",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "tqdm>=4.66",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "black>=24.8",
    "isort>=5.13",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "ruff>=0.4",
    "types-PyYAML",
]
docs = [
    "sphinx>=7.3",
    "sphinx-rtd-theme>=2.0",
    "nbsphinx>=0.9",
    "jupyter>=1.0",
    "sphinx-autodoc-typehints",
]
papr = ["clipping", "slm", "pts"]  # placeholder برای future methods

[project.urls]
Homepage = "https://github.com/M-Amin-Wolverine/ofdm-papr-communication-link"
"Bug Tracker" = "https://github.com/M-Amin-Wolverine/ofdm-papr-communication-link/issues"
"Documentation" = "https://github.com/M-Amin-Wolverine/ofdm-papr-communication-link/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ofdm_linksim*"]
exclude = ["ofdm_linksim.tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

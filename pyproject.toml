# =============================================================================
# ofdm-papr-communication-link
# A Modular End-to-End OFDM Communication Link Simulator
# with PAPR Reduction Techniques and Performance Analysis
# =============================================================================

[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


# =============================================================================
# Project Metadata
# =============================================================================

[project]

name = "ofdm-papr-communication-link"

version = "0.1.0"

description = "A modular end-to-end OFDM communication link simulator with configurable PAPR reduction techniques, channel models, synchronization impairments, and performance analysis."

readme = "README.md"

requires-python = ">=3.10"

license = { file = "LICENSE" }

authors = [
    { name = "Mohammad Amin Khodadadi" }
]

maintainers = [
    { name = "Zeynoth" }
]

keywords = [
    "OFDM",
    "PAPR",
    "OFDM simulation",
    "digital communications",
    "wireless communications",
    "communication systems",
    "signal processing",
    "modulation",
    "QPSK",
    "QAM",
    "16-QAM",
    "64-QAM",
    "256-QAM",
    "1024-QAM",
    "clipping",
    "SLM",
    "PTS",
    "tone reservation",
    "ACE",
    "AWGN",
    "Rayleigh fading",
    "Rician fading",
    "CFO",
    "Doppler",
    "MMSE",
    "ZF",
    "BER",
    "EVM",
    "PSD",
    "CCDF",
    "telecommunications",
    "research",
    "simulation"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]


# =============================================================================
# Runtime Dependencies
# =============================================================================

dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "matplotlib>=3.8,<4.0",
    "pandas>=2.1,<4.0",
    "tqdm>=4.66,<5.0",
    "PyYAML>=6.0,<7.0"
]


# =============================================================================
# Optional Dependencies
# =============================================================================

[project.optional-dependencies]

dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "black>=24.0,<27.0",
    "mypy>=1.10,<2.0"
]

docs = [
    "sphinx>=7.0,<9.0",
    "sphinx-rtd-theme>=2.0,<4.0"
]

all = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "black>=24.0,<27.0",
    "mypy>=1.10,<2.0",
    "sphinx>=7.0,<9.0",
    "sphinx-rtd-theme>=2.0,<4.0"
]


# =============================================================================
# Project URLs
# =============================================================================

[project.urls]

Homepage = "https://github.com/M-Amin-Wolverine/ofdm-papr-communication-link/"

Repository = "https://github.com/M-Amin-Wolverine/ofdm-papr-communication-link/"

Documentation = "https://github.com/M-Amin-Wolverine/ofdm-papr-communication-link#readme"

Issues = "https://github.com/M-Amin-Wolverine/ofdm-papr-communication-link/issues"

Changelog = "https://github.com/M-Amin-Wolverine/ofdm-papr-communication-link/blob/main/CHANGELOG.md"


# =============================================================================
# Package Discovery
# =============================================================================

[tool.setuptools.packages.find]

where = ["src"]

include = [
    "ofdm_linksim*"
]

exclude = [
    "tests*"
]


# =============================================================================
# Package Data
# =============================================================================

[tool.setuptools.package-data]

ofdm_linksim = [
    "data/**/*",
    "configs/**/*"
]


# =============================================================================
# Black - Code Formatting
# =============================================================================

[tool.black]

line-length = 100

target-version = [
    "py310",
    "py311",
    "py312"
]

include = '\.pyi?$'

exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | results
)/
'''


# =============================================================================
# Ruff - Linting and Import Sorting
# =============================================================================

[tool.ruff]

line-length = 100

target-version = "py310"

exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "results"
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP"
]

ignore = [
    "E501"
]


# =============================================================================
# Pytest - Testing Configuration
# =============================================================================

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

addopts = [
    "-ra",
    "--strict-markers"
]

markers = [
    "unit: Unit tests for individual communication blocks",
    "integration: End-to-end communication link tests",
    "papr: PAPR reduction algorithm tests",
    "channel: Channel model tests",
    "performance: Performance and benchmark tests"
]


# =============================================================================
# Mypy - Static Type Checking
# =============================================================================

[tool.mypy]

python_version = "3.10"

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

exclude = [
    "tests/",
    "results/"
]

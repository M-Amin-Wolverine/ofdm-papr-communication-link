# =============================================================================
# PAPR scenario: Selected Mapping (SLM) — Phase-2
# =============================================================================
# Algorithm module is a stub in Stage-1 (NotImplementedError).
# This YAML reserves the experiment layout for Phase-2.
# =============================================================================
# =============================================================================
# PAPR scenario: Selected Mapping (SLM)
# =============================================================================

scenario:
  name: "papr_slm"
  version: "1.0"
  status: "active"
  reference: false
  description: >
    Selected Mapping (SLM) PAPR reduction with multiple phase candidates.
  papr_reduction: "slm"

extends: "configs/baseline.yaml"

papr:
  method: "slm"
  include_cp: false
  analysis_enabled: true
  slm:
    n_candidates: 16
    phase_set: "bipolar"

channel:
  model: "AWGN"
  enabled: true
  fading: false

coding:
  enabled: false
  scheme: "none"

simulation:
  mode: "development"
  ofdm_blocks: 10000

random:
  seed: 42
  deterministic: true
  centralized: true

results:
  root_directory: "results/experiments/papr/slm"

reference_constraints:
  require_no_papr_reduction: false
  require_cp_excluded_from_papr: true

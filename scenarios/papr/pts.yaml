# =============================================================================
# PAPR scenario: Partial Transmit Sequence (PTS)
# =============================================================================

scenario:
  name: "papr_pts"
  version: "1.0"
  status: "active"
  reference: false
  description: >
    Partial Transmit Sequence (PTS) with adjacent sub-block partitioning.
  papr_reduction: "pts"

extends: "configs/baseline.yaml"

papr:
  method: "pts"
  include_cp: false
  analysis_enabled: true
  pts:
    n_subblocks: 4
    n_candidates: 64
    phase_set: "bipolar"
    search: "random"

channel:
  model: "AWGN"
  enabled: true
  fading: false

coding:
  enabled: false
  scheme: "none"

simulation:
  mode: "development"
  ofdm_blocks: 10000

random:
  seed: 42
  deterministic: true
  centralized: true

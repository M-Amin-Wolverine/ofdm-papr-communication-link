# =============================================================================
# Profile: IEEE 802.11a-like OFDM parameters
# =============================================================================
# Approximate classic WLAN OFDM numerology (FFT 64), for comparative PAPR /
# link experiments. Not the locked Stage-1 scientific reference.
# =============================================================================

scenario:
  name: "ieee80211a_like"
  version: "1.0"
  status: "active"
  reference: false
  description: >
    OFDM profile inspired by IEEE 802.11a numerology (FFT size 64).
    Used for PAPR and BER comparisons against the project baseline (FFT 256).
  papr_reduction: "none"

extends: "configs/baseline.yaml"

ofdm:
  fft_size: 64
  active_subcarriers: 52
  pilot_subcarriers: 4
  data_subcarriers: 48
  cyclic_prefix_length: 16
  oversampling_factor: 4
  oversampling_method: "frequency_domain_zero_padding"
  fft_normalization: "unitary"
  mapping:
    type: "symmetric"
    include_dc: false
  papr_include_cp: false

modulation:
  scheme: "QPSK"
  order: 4
  bits_per_symbol: 2
  mapping: "gray"
  normalize_average_power: true
  target_average_symbol_energy: 1.0

channel:
  model: "AWGN"
  enabled: true
  fading: false

coding:
  enabled: false
  scheme: "none"

interleaving:
  enabled: false
  type: "none"

synchronization:
  enabled: false

equalization:
  enabled: false
  method: "none"

papr:
  method: "none"
  include_cp: false
  analysis_enabled: true

simulation:
  mode: "development"
  ofdm_blocks: 10000
  development_ofdm_blocks: 2000

random:
  seed: 42
  deterministic: true
  centralized: true

results:
  root_directory: "results/experiments/profiles/ieee80211a"
  overwrite: false
  save_configuration: true
  save_summary: true

reference_constraints:
  require_uncoded: true
  require_awgn: true
  require_no_papr_reduction: true
  require_cp_excluded_from_papr: true
